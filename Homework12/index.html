<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите Ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите Ваш комментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>

    <script>
    "use strict";

// Устанавливаем пустой массив
let commentsData = [];

// Функция для отображения комментариев на странице
function renderComments() {
  const commentsList = document.querySelector(".comments");
  commentsList.innerHTML = "";

  commentsData.forEach((comment, index) => {
    // Создаем новый элемент комментария
    const newComment = document.createElement("li");
    newComment.classList.add("comment");

    // Заполняем HTML для комментария
    newComment.innerHTML = `
      <div class="comment-header">
        <div>${comment.name}</div>
        <div>${comment.date}</div>
      </div>
      <div class="comment-body">
        <div class="comment-text" onclick="showComment('${sanitizeHTML(
          comment.text
        )}')">
           ${sanitizeHTML(comment.text)}
        </div>
      </div>
      <div class="comment-footer">
        <div class="likes">
          <span class="likes-counter">${comment.likes}</span>
          <button class="like-button ${
            comment.liked ? "-active-like" : ""
          }"></button>
        </div>
      </div>
    `;

    // Добавляем комментарий на страницу
    commentsList.appendChild(newComment);

    // Обработчик для кнопки лайка
    const likeButton = newComment.querySelector(".like-button");
    likeButton.addEventListener("click", function () {
      if (comment.liked) {
        comment.likes--;
      } else {
        comment.likes++;
      }
      comment.liked = !comment.liked;
      renderComments();
    });
  });
}

// Функция для отображения комментария в поле ввода
function showComment(commentText) {
  const textInput = document.querySelector(".add-form-text");
  const formattedText = commentText.trim().startsWith(">")
    ? commentText.trim()
    : "> " + commentText.trim();
  textInput.value = formattedText;
}

// Получаем элементы формы и добавляем обработчик события для добавления комментария
const addButton = document.querySelector(".add-form-button");
const nameInput = document.querySelector(".add-form-name");
const textInput = document.querySelector(".add-form-text");

addButton.addEventListener("click", function () {
  const name = sanitizeInput(nameInput.value.trim());
  const text = sanitizeInput(textInput.value.trim());

  // Проверяем заполнены ли оба поля перед добавлением комментария
  if (name !== "" && text !== "") {
   
    
    // Отправляем новый комментарий на сервер
    fetch("https://wedev-api.sky.pro/api/v1/zalim-zalim/comments", {
      method: "POST",
      body: JSON.stringify({
        name: name,
        text: text,
      }),
    })
      .then((response) => response.json())
      .then((data) => {
        getComments();
        // Очистка полей формы после отправки комментария
        nameInput.value = "";
        textInput.value = "";
      })
      .catch((error) => console.error("Error sending comment:", error));
  } else {
    alert("Please fill in both fields");
  }
});

// Получаем комментарии с сервера и обрабатываем их


function getComments () {
  return fetch("https://wedev-api.sky.pro/api/v1/zalim-zalim/comments", {
  method: "GET"
})
  .then((response) => response.json())
  .then((data) => {
    console.log(data);

    // Преобразуем полученные данные в нужный формат и добавляем их в commentsData
    commentsData = data.comments.map(comment => {
      return {
        name: comment.author.name,
        date: new Date(comment.date).toLocaleString(),
        text: comment.text,
        likes: comment.likes,
        liked: false
      };
    });

    console.log(commentsData); // Выводим полученные данные в консоль
    renderComments(); // Вызываем функцию отображения комментариев
  })
  .catch((error) => console.error("Error fetching comments:", error));

}
// Функция для очистки опасных символов в HTML
function sanitizeHTML(str) {
  const div = document.createElement("div");
  div.innerText = str;
  return div.innerHTML
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/\//g, "&#47;");
}

// Функция для очистки опасных символов во вводе
function sanitizeInput(input) {
  let sanitizedInput = input.replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return sanitizedInput;
}

// Инициализация отображения комментариев
getComments ()
    </script>
  </body>
</html>
