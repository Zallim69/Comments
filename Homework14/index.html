<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите Ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите Ваш комментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>

    <script>
"use strict";

let commentsData = [];

function renderComments() {
  const commentsList = document.querySelector(".comments");
  commentsList.innerHTML = "";

  commentsData.forEach((comment, index) => {
    const newComment = document.createElement("li");
    newComment.classList.add("comment");

    newComment.innerHTML = `
      <div class="comment-header">
        <div>${comment.name}</div>
        <div>${comment.date}</div>
      </div>
      <div class="comment-body">
        <div class="comment-text" onclick="showComment('${sanitizeHTML(comment.text)}')">
           ${sanitizeHTML(comment.text)}
        </div>
      </div>
      <div class="comment-footer">
        <div class="likes">
          <span class="likes-counter">${comment.likes}</span>
          <button class="like-button ${comment.liked ? "-active-like" : ""}"></button>
        </div>
      </div>
    `;

    commentsList.appendChild(newComment);

    const likeButton = newComment.querySelector(".like-button");
    likeButton.addEventListener("click", function () {
      if (comment.liked) {
        comment.likes--;
      } else {
        comment.likes++;
      }
      comment.liked = !comment.liked;
      renderComments();
    });
  });
}

function showComment(commentText) {
  const textInput = document.querySelector(".add-form-text");
  const formattedText = commentText.trim().startsWith(">")
    ? commentText.trim()
    : "> " + commentText.trim();
  textInput.value = formattedText;
}

const addButton = document.querySelector(".add-form-button");
const nameInput = document.querySelector(".add-form-name");
const textInput = document.querySelector(".add-form-text");
const addForm = document.querySelector(".add-form");
const loadingMessage = document.createElement("div");
loadingMessage.innerText = "Комментарий добавляется";

addButton.addEventListener("click", function () {
  const name = sanitizeInput(nameInput.value.trim());
  const text = sanitizeInput(textInput.value.trim());

  if (!name || !text) {
    alert("Имя и комментарий не могут быть пустыми");
    return;
  }

  if (navigator.onLine) {
    addForm.replaceWith(loadingMessage);

   

  fetch("https://wedev-api.sky.pro/api/v1/zalim-zalim/comments", {
  method: "POST",
  body: JSON.stringify({
    name: name,
    text: text,
    forceError: true,
  }),
})
  .then((response) => {
    if (response.status === 400) {
      throw new Error("Bad request");
    }
    if (response.status === 500) {
      throw new Error("Server error");
    }
    return response.json();
  })
  .then((data) => {
    getComments();
    nameInput.value = "";
    textInput.value = "";
    loadingMessage.replaceWith(addForm);
  })
  .catch((error) => {
    console.error("Error sending comment:", error);
    if (error.message === "Bad request") {
      alert("Имя и комментарий должны быть не короче 3-х символов");
      loadingMessage.replaceWith(addForm);
    } else if (error.message === "Server error") {
      alert("Сервер сломался, попробуйте позже");
      loadingMessage.replaceWith(addForm);
    }
  });
  } else {
    alert("У пользователя пропал интернет");
  }
});

const loader = document.createElement("div");
loader.classList.add("loader");
loader.innerText = "Пожалуйста подождите, комментарии загружаются";
document.body.appendChild(loader);

getComments()
  .then(() => document.body.removeChild(loader))
  .catch((error) => {
    console.error("Error fetching comments:", error);
    alert("Не удалось загрузить комментарии. Пожалуйста, попробуйте позже.");
    document.body.removeChild(loader);
  });
  function getComments() {
    return fetch("https://wedev-api.sky.pro/api/v1/zalim-zalim/comments", {
    method: "GET"
  })
    .then((response) => {
      if (!response.ok) {
        throw new Error("Failed to fetch comments");
      }
      return response.json();
    })
    .then((data) => {
      commentsData = data.comments.map(comment => {
        return {
          name: comment.author.name,
          date: new Date(comment.date).toLocaleString(),
          text: comment.text,
          likes: comment.likes,
          liked: false
        };
      });
      renderComments();
    })
    .catch((error) => {
      console.error("Error fetching comments:", error);
      alert("Не удалось получить комментарии. Пожалуйста, проверьте подключение к интернету и попробуйте снова.");
    });
}
  

function sanitizeHTML(str) {
  return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function sanitizeInput(input) {
  return input.replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
    </script>
  </body>
</html>
